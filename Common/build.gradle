plugins {
    id 'multiloader-common'
    alias(nyfs.plugins.mdg.loader)
    alias(nyfs.plugins.regutils.loader)
    id 'multiloader-vanilla'
}

repositories {
    maven { url = 'https://maven.100media.dev/releases' }
}

dependencies {
    compileOnly "org.spongepowered:mixin:${nyfs.versions.mixin.asProvider().get()}"
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    compileOnly nyfs.mixin.extras.forge.get()
    annotationProcessor nyfs.mixin.extras.common.get()
    compileOnly nyfs.config.api.common.get()
    compileOnly nyfs.geckolib.forge.get()
    compileOnly("com.nyfaria.perfectplushieapi:perfectplushieapi-Common-1.20.1:${plushie_api_version}") {
        transitive = false
    }
}
